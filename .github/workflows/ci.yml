name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke

      # Linux runners have no Secret Service by default; start an unlocked gnome-keyring on a private D-Bus session.
      - name: Smoke test (Linux, with gnome-keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 >/dev/null
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm run smoke'

      # Plain `eas` through the shell-init hook, outside a linked project, runs the normal (bundled) eas.
      - name: Shell hook (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm link
          easw shell-init powershell | Out-String | Invoke-Expression
          $out = eas --version
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch "eas-cli/") { throw "hook failed: $out" }
          Write-Output "hooked eas: $out"
          easw hook powershell
          $profilePath = $PROFILE.CurrentUserCurrentHost
          if (-not (Select-String -Path $profilePath -Pattern "easw shell-init powershell" -Quiet)) { throw "easw hook didn't update $profilePath" }
          easw unhook powershell
          if (Select-String -Path $profilePath -Pattern "easw shell-init powershell" -Quiet) { throw "easw unhook didn't clean $profilePath" }

      - name: Shell hook (fish, bash)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fish >/dev/null
          npm link
          fish -c 'easw shell-init fish | source; and eas --version' | grep 'eas-cli/'
          bash -c 'eval "$(easw shell-init bash)"; eas --version' | grep 'eas-cli/'
