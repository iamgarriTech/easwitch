name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: EASwitch adds account switching on top of EAS CLI; it doesn't replace it. Ideas that fit that scope are most likely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I work across client projects, I often ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Commands, flags or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
